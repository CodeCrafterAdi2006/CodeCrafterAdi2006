<style>
  .bg { fill: #0d1117; rx: 8px; ry: 8px; stroke: #30363d; stroke-width: 1.5; }
  .title { font-family: "Fira Code", monospace; font-size: 10px; fill: #00FF41; font-weight: bold; letter-spacing: 2px; }
  .ascii { font-family: "Fira Code", "Courier New", monospace; font-size: 10.5px; fill: #00FF41; white-space: pre; }
  @keyframes matrixGlow {
    0% { fill: #00FF41; opacity: 0.88; }
    50% { fill: #39FF14; opacity: 1.0; }
    100% { fill: #00FF41; opacity: 0.88; }
  }
  @keyframes scanBeam {
    0% { y: 35px; opacity: 0; }
    10% { opacity: 0.35; }
    90% { opacity: 0.35; }
    100% { y: 508px; opacity: 0; }
  }
  @keyframes swapFrame1 { 0%, 49.9% { opacity: 1; } 50%, 100% { opacity: 0; } }
  @keyframes swapFrame2 { 0%, 49.9% { opacity: 0; } 50%, 100% { opacity: 1; } }
  .frame1 { animation: swapFrame1 0.3s infinite steps(1); }
  .frame2 { animation: swapFrame2 0.3s infinite steps(1); }
</style>
